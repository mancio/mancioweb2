# Deploy site updates to Firebase Hosting using the same service account
# as update-stocks.yml. Stock report generation remains on its own schedule.
name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "!public/stocks.html"
      - "package.json"
      - "package-lock.json"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-website-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build site
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MANCIOTECH_244AC }}
          projectId: manciotech-244ac
          channelId: live
